alertmanager:
  enabled: false

nodeExporter:
  enabled: false

kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    alertmanager: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    kubePrometheusNodeRecording: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

prometheus:
  prometheusSpec:
    retention: 1d
    scrapeInterval: 30s
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

grafana:
  testFramework:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
