apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - servicemonitor-task-api.yaml
  - servicemonitor-task-ui.yaml

configMapGenerator:
  - name: opsdesk-dashboards
    namespace: monitoring
    files:
      - dashboards/opsdesk-overview.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: '1'
