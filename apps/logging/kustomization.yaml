apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: logging

resources:
  - elasticsearch.yaml
  - kibana.yaml
  - setup-job.yaml

secretGenerator:
  - name: opsdesk-es-roles
    files:
      - roles.yml
    options:
      disableNameSuffixHash: true

configMapGenerator:
  - name: opsdesk-es-setup
    files:
      - setup/ilm-policy.json
      - setup/index-template.json
    options:
      disableNameSuffixHash: true
