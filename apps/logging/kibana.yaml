apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: opsdesk
spec:
  version: 9.5.5
  image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
  count: 1
  elasticsearchRef:
    name: opsdesk
  config:
    telemetry.optIn: false
    telemetry.allowChangingOptInStatus: false
  podTemplate:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kibana
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 1536Mi
            limits:
              memory: 1536Mi
