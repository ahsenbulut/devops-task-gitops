apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.0.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/apps/monitoring/values.yaml
    - repoURL: https://github.com/ahsenbulut/devops-task-gitops
      targetRevision: main
      ref: values
    - repoURL: https://github.com/ahsenbulut/devops-task-gitops
      targetRevision: main
      path: apps/monitoring/config
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
