apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-task-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ahsenbulut/devops-task-gitops
    targetRevision: main
    path: apps/task-api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-case
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
